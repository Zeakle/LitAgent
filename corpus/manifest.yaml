papers:
  - paper_id: arxiv:1703.05175
    arxiv_id: "1703.05175"
    title: Prototypical Networks for Few-shot Learning
    authors: [Jake Snell, Kevin Swersky, Richard S. Zemel]
    year: 2017
    abstract: >-
      We propose prototypical networks for the problem of few-shot
      classification, where a classifier must generalize to new classes not
      seen in the training set, given only a small number of examples of each
      new class. Prototypical networks learn a metric space in which
      classification can be performed by computing distances to prototype
      representations of each class. Compared to recent approaches for
      few-shot learning, they reflect a simpler inductive bias that is
      beneficial in this limited-data regime. We further extend prototypical
      networks to zero-shot learning.
    pdf:
      kind: arxiv_pdf
      url: https://arxiv.org/pdf/1703.05175

  - paper_id: arxiv:2003.11539
    arxiv_id: "2003.11539"
    title: "Rethinking Few-Shot Image Classification: a Good Embedding Is All You Need?"
    authors: [Yonglong Tian, Yue Wang, Dilip Krishnan, Joshua B. Tenenbaum, Phillip Isola]
    year: 2020
    abstract: >-
      Few-shot learning is widely used as a standard benchmark in
      meta-learning. This work shows that a simple baseline, learning a
      supervised or self-supervised representation on the meta-training set
      and then training a linear classifier on top, outperforms state-of-the-art
      few-shot learning methods. Self-distillation provides an additional
      boost, suggesting that a good learned embedding can be more effective
      than sophisticated meta-learning algorithms.
    pdf:
      kind: arxiv_pdf
      url: https://arxiv.org/pdf/2003.11539

  - paper_id: arxiv:2008.11297
    arxiv_id: "2008.11297"
    title: Transductive Information Maximization For Few-Shot Learning
    authors: [Malik Boudiaf, Ziko Imtiaz Masud, Jérôme Rony, José Dolz, Pablo Piantanida, Ismail Ben Ayed]
    year: 2020
    abstract: >-
      We introduce Transductive Information Maximization for few-shot
      learning. The method maximizes mutual information between query features
      and their label predictions for a given few-shot task, together with a
      supervision loss on the support set. An alternating-direction solver
      accelerates transductive inference. TIM is modular, works on top of a
      base-trained feature extractor, and is evaluated across datasets,
      networks, domain shifts, and larger numbers of classes.
    pdf:
      kind: arxiv_pdf
      url: https://arxiv.org/pdf/2008.11297

  - paper_id: arxiv:2104.02638
    arxiv_id: "2104.02638"
    title: Comparing Transfer and Meta Learning Approaches on a Unified Few-Shot Classification Benchmark
    authors: [Vincent Dumoulin, Neil Houlsby, Utku Evci, Xiaohua Zhai, Ross Goroshin, Sylvain Gelly, Hugo Larochelle]
    year: 2021
    abstract: >-
      Meta and transfer learning are successful approaches to few-shot
      learning, but diverging evaluation norms make direct comparison
      difficult. This study compares transfer and meta learners on Meta-Dataset
      and the Visual Task Adaptation Benchmark. Large-scale transfer methods
      perform strongly on Meta-Dataset, while meta-learning approaches struggle
      on VTAB; scaling also has limits on highly out-of-distribution tasks.
    pdf:
      kind: arxiv_pdf
      url: https://arxiv.org/pdf/2104.02638

  - paper_id: arxiv:2109.01134
    arxiv_id: "2109.01134"
    title: Learning to Prompt for Vision-Language Models
    authors: [Kaiyang Zhou, Jingkang Yang, Chen Change Loy, Ziwei Liu]
    year: 2021
    abstract: >-
      Pre-trained vision-language models such as CLIP enable zero-shot transfer
      through prompting, but prompt engineering is expensive and sensitive to
      wording. Context Optimization learns continuous prompt context vectors
      while keeping the pre-trained model fixed. Across image-recognition
      datasets, CoOp improves over hand-crafted prompts with few labeled shots
      and demonstrates domain-generalization behavior.
    pdf:
      kind: arxiv_pdf
      url: https://arxiv.org/pdf/2109.01134
