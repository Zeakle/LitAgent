[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litagent"
version = "0.1.0"
description = "LitAgent — 基于多Agent对抗协作的学术文献系统性综述框架"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "redis>=5.0",
    "qdrant-client>=1.7",
    "orjson>=3.9",
    "asyncpg>=0.29",
    "sentence-transformers>=3.0",
    "langchain-text-splitters>=0.3",
    "openai>=1.0",
    "mcp>=1.27,<2",
    "pymupdf>=1.24,<2",
]

[project.scripts]
litagent = "litagent.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
observability = [
    "langfuse>=3.0,<4",
]
dev = [
    "black>=24.0,<26",
    "isort>=5.13,<7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langfuse>=3.0,<4",
]
ragas = [
    "ragas>=0.4,<0.5",
]

[tool.setuptools.package-data]
litagent = [
    "skills/*/SKILL.md",
    "static/flow-demo/*",
    "rag/*.sql",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
addopts = "-m \"not integration\""
markers = [
    "integration: requires explicitly configured isolated Redis/Qdrant/PostgreSQL services",
]
