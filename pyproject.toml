[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litagent"
version = "0.1.0"
description = "LitAgent — 基于多Agent对抗协作的学术文献系统性综述框架"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "redis>=5.0",            # async Redis client
    "qdrant-client>=1.7",    # Qdrant async client
    "orjson>=3.9",           # 快 3-5x 的 JSON 序列化
    "asyncpg>=0.29",
    "sentence-transformers>=3.0",       # embedding + cross-encoder
    "langchain-text-splitters>=0.3",  
    'openai>=1.0',
    "mcp>=1.27,<2", 
]

[project.scripts]
litagent = "litagent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]