name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install
        run: python -m pip install -c requirements/release-constraints.txt -e ".[dev]"
      - name: Black
        run: python -m black --check src tests
      - name: Isort
        run: python -m isort --check-only --profile black src tests
      - name: Whitespace
        run: git diff-tree --check --root -r -m HEAD
      - name: Offline tests
        run: python -m pytest -v -m "not integration and not live"
