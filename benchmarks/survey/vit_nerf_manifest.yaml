- paper_id: arxiv:2012.02190
  arxiv_id: '2012.02190'
  title: 'pixelNeRF: Neural Radiance Fields from One or Few Images'
  year: 2020
  abstract: 'We propose pixelNeRF, a learning framework that predicts a continuous neural scene representation
    conditioned on one or few input images. The existing approach for constructing neural radiance fields
    involves optimizing the representation to every scene independently, requiring many calibrated views
    and significant compute time. We take a step towards resolving these shortcomings by introducing an
    architecture that conditions a NeRF on image inputs in a fully convolutional manner. This allows the
    network to be trained across multiple scenes to learn a scene prior, enabling it to perform novel
    view synthesis in a feed-forward manner from a sparse set of views (as few as one). Leveraging the
    volume rendering approach of NeRF, our model can be trained directly from images with no explicit
    3D supervision. We conduct extensive experiments on ShapeNet benchmarks for single image novel view
    synthesis tasks with held-out objects as well as entire unseen categories. We further demonstrate
    the flexibility of pixelNeRF by demonstrating it on multi-object ShapeNet scenes and real scenes from
    the DTU dataset. In all cases, pixelNeRF outperforms current state-of-the-art baselines for novel
    view synthesis and single image 3D reconstruction. For the video and code, please visit the project
    website: https://alexyu.net/pixelnerf'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2012.02190
  abstract_summary: pixelNeRF conditions a continuous radiance field on image features and learns across
    scenes, enabling feed-forward novel-view synthesis from one or a few input images.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2012.02190
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: 21f3fec4cbd6de5731ac4b264bc1a32dcda3bd73d1066e2c4f0c7350f64c6230
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2102.13090
  arxiv_id: '2102.13090'
  title: 'IBRNet: Learning Multi-View Image-Based Rendering'
  year: 2021
  abstract: 'We present a method that synthesizes novel views of complex scenes by interpolating a sparse
    set of nearby views. The core of our method is a network architecture that includes a multilayer perceptron
    and a ray transformer that estimates radiance and volume density at continuous 5D locations (3D spatial
    locations and 2D viewing directions), drawing appearance information on the fly from multiple source
    views. By drawing on source views at render time, our method hearkens back to classic work on image-based
    rendering (IBR), and allows us to render high-resolution imagery. Unlike neural scene representation
    work that optimizes per-scene functions for rendering, we learn a generic view interpolation function
    that generalizes to novel scenes. We render images using classic volume rendering, which is fully
    differentiable and allows us to train using only multi-view posed images as supervision. Experiments
    show that our method outperforms recent novel view synthesis methods that also seek to generalize
    to novel scenes. Further, if fine-tuned on each scene, our method is competitive with state-of-the-art
    single-scene neural rendering methods. Project page: https://ibrnet.github.io/'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2102.13090
  abstract_summary: IBRNet draws appearance from nearby source views at render time and learns a generic
    multi-view interpolation function that generalizes to novel scenes.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2102.13090
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: 8b73c7e70a4a82d5105ce79957cdd48aa9c9bc89613a2c6c5520e374a4526083
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2103.15595
  arxiv_id: '2103.15595'
  title: 'MVSNeRF: Fast Generalizable Radiance Field Reconstruction from Multi-View Stereo'
  year: 2021
  abstract: We present MVSNeRF, a novel neural rendering approach that can efficiently reconstruct neural
    radiance fields for view synthesis. Unlike prior works on neural radiance fields that consider per-scene
    optimization on densely captured images, we propose a generic deep neural network that can reconstruct
    radiance fields from only three nearby input views via fast network inference. Our approach leverages
    plane-swept cost volumes (widely used in multi-view stereo) for geometry-aware scene reasoning, and
    combines this with physically based volume rendering for neural radiance field reconstruction. We
    train our network on real objects in the DTU dataset, and test it on three different datasets to evaluate
    its effectiveness and generalizability. Our approach can generalize across scenes (even indoor scenes,
    completely different from our training scenes of objects) and generate realistic view synthesis results
    using only three input images, significantly outperforming concurrent works on generalizable radiance
    field reconstruction. Moreover, if dense images are captured, our estimated radiance field representation
    can be easily fine-tuned; this leads to fast per-scene reconstruction with higher rendering quality
    and substantially less optimization time than NeRF.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2103.15595
  abstract_summary: MVSNeRF combines plane-swept cost volumes with volume rendering to reconstruct generalizable
    radiance fields from three input views and optionally fine-tune per scene.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2103.15595
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: afb58150749d2a8c3f1cdb179e77d0b277e4f7cb5d71f0277b0cd57dc68cc9e3
