- paper_id: arxiv:2201.03545
  arxiv_id: '2201.03545'
  title: A ConvNet for the 2020s
  year: 2022
  abstract: The "Roaring 20s" of visual recognition began with the introduction of Vision Transformers
    (ViTs), which quickly superseded ConvNets as the state-of-the-art image classification model. A vanilla
    ViT, on the other hand, faces difficulties when applied to general computer vision tasks such as object
    detection and semantic segmentation. It is the hierarchical Transformers (e.g., Swin Transformers)
    that reintroduced several ConvNet priors, making Transformers practically viable as a generic vision
    backbone and demonstrating remarkable performance on a wide variety of vision tasks. However, the
    effectiveness of such hybrid approaches is still largely credited to the intrinsic superiority of
    Transformers, rather than the inherent inductive biases of convolutions. In this work, we reexamine
    the design spaces and test the limits of what a pure ConvNet can achieve. We gradually "modernize"
    a standard ResNet toward the design of a vision Transformer, and discover several key components that
    contribute to the performance difference along the way. The outcome of this exploration is a family
    of pure ConvNet models dubbed ConvNeXt. Constructed entirely from standard ConvNet modules, ConvNeXts
    compete favorably with Transformers in terms of accuracy and scalability, achieving 87.8% ImageNet
    top-1 accuracy and outperforming Swin Transformers on COCO detection and ADE20K segmentation, while
    maintaining the simplicity and efficiency of standard ConvNets.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2201.03545
  abstract_summary: ConvNeXt modernizes a ResNet using design choices associated with vision transformers
    and shows that a pure convolutional network can compete on classification and dense prediction.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2201.03545
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: a0de4d89d6514f9af95046c6372869491359b53cc7fd45f8818ee88a134d3296
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2012.12877
  arxiv_id: '2012.12877'
  title: Training data-efficient image transformers and distillation through attention
  year: 2020
  abstract: Recently, neural networks purely based on attention were shown to address image understanding
    tasks such as image classification. However, these visual transformers are pre-trained with hundreds
    of millions of images using an expensive infrastructure, thereby limiting their adoption. In this
    work, we produce a competitive convolution-free transformer by training on Imagenet only. We train
    them on a single computer in less than 3 days. Our reference vision transformer (86M parameters) achieves
    top-1 accuracy of 83.1% (single-crop evaluation) on ImageNet with no external data. More importantly,
    we introduce a teacher-student strategy specific to transformers. It relies on a distillation token
    ensuring that the student learns from the teacher through attention. We show the interest of this
    token-based distillation, especially when using a convnet as a teacher. This leads us to report results
    competitive with convnets for both Imagenet (where we obtain up to 85.2% accuracy) and when transferring
    to other tasks. We share our code and models.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2012.12877
  abstract_summary: DeiT trains competitive convolution-free transformers on ImageNet without massive
    external data and introduces a distillation token for teacher-student training through attention.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2012.12877
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: defeaa5bbbb2ab9b28844bfba779e99b48f144bb76f6935521d3757ef91ea26d
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2101.11986
  arxiv_id: '2101.11986'
  title: 'Tokens-to-Token ViT: Training Vision Transformers from Scratch on ImageNet'
  year: 2021
  abstract: 'Transformers, which are popular for language modeling, have been explored for solving vision
    tasks recently, e.g., the Vision Transformer (ViT) for image classification. The ViT model splits
    each image into a sequence of tokens with fixed length and then applies multiple Transformer layers
    to model their global relation for classification. However, ViT achieves inferior performance to CNNs
    when trained from scratch on a midsize dataset like ImageNet. We find it is because: 1) the simple
    tokenization of input images fails to model the important local structure such as edges and lines
    among neighboring pixels, leading to low training sample efficiency; 2) the redundant attention backbone
    design of ViT leads to limited feature richness for fixed computation budgets and limited training
    samples. To overcome such limitations, we propose a new Tokens-To-Token Vision Transformer (T2T-ViT),
    which incorporates 1) a layer-wise Tokens-to-Token (T2T) transformation to progressively structurize
    the image to tokens by recursively aggregating neighboring Tokens into one Token (Tokens-to-Token),
    such that local structure represented by surrounding tokens can be modeled and tokens length can be
    reduced; 2) an efficient backbone with a deep-narrow structure for vision transformer motivated by
    CNN architecture design after empirical study. Notably, T2T-ViT reduces the parameter count and MACs
    of vanilla ViT by half, while achieving more than 3.0\% improvement when trained from scratch on ImageNet.
    It also outperforms ResNets and achieves comparable performance with MobileNets by directly training
    on ImageNet. For example, T2T-ViT with comparable size to ResNet50 (21.5M parameters) can achieve
    83.3\% top1 accuracy in image resolution 384$\times$384 on ImageNet. (Code: https://github.com/yitu-opensource/T2T-ViT)'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2101.11986
  abstract_summary: T2T-ViT recursively aggregates neighboring tokens to model local structure and uses
    a deep-narrow transformer backbone to improve sample efficiency when training on ImageNet from scratch.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2101.11986
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: b5f537f90a219a54fdd2931eb54511af5cc4ac1b8772147e219819e02a2a9b17
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2103.14030
  arxiv_id: '2103.14030'
  title: 'Swin Transformer: Hierarchical Vision Transformer using Shifted Windows'
  year: 2021
  abstract: This paper presents a new vision Transformer, called Swin Transformer, that capably serves
    as a general-purpose backbone for computer vision. Challenges in adapting Transformer from language
    to vision arise from differences between the two domains, such as large variations in the scale of
    visual entities and the high resolution of pixels in images compared to words in text. To address
    these differences, we propose a hierarchical Transformer whose representation is computed with \textbf{S}hifted
    \textbf{win}dows. The shifted windowing scheme brings greater efficiency by limiting self-attention
    computation to non-overlapping local windows while also allowing for cross-window connection. This
    hierarchical architecture has the flexibility to model at various scales and has linear computational
    complexity with respect to image size. These qualities of Swin Transformer make it compatible with
    a broad range of vision tasks, including image classification (87.3 top-1 accuracy on ImageNet-1K)
    and dense prediction tasks such as object detection (58.7 box AP and 51.1 mask AP on COCO test-dev)
    and semantic segmentation (53.5 mIoU on ADE20K val). Its performance surpasses the previous state-of-the-art
    by a large margin of +2.7 box AP and +2.6 mask AP on COCO, and +3.2 mIoU on ADE20K, demonstrating
    the potential of Transformer-based models as vision backbones. The hierarchical design and the shifted
    window approach also prove beneficial for all-MLP architectures. The code and models are publicly
    available at~\url{https://github.com/microsoft/Swin-Transformer}.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2103.14030
  abstract_summary: Swin Transformer uses a hierarchical representation and shifted local windows to obtain
    linear image-size complexity and serve as a general-purpose vision backbone.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2103.14030
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: b9c930545e191331d369eccb46b0bd5ce7502a8ed91ba43c3f051724393a95e2
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2102.12122
  arxiv_id: '2102.12122'
  title: 'Pyramid Vision Transformer: A Versatile Backbone for Dense Prediction without Convolutions'
  year: 2021
  abstract: Although using convolutional neural networks (CNNs) as backbones achieves great successes
    in computer vision, this work investigates a simple backbone network useful for many dense prediction
    tasks without convolutions. Unlike the recently-proposed Transformer model (e.g., ViT) that is specially
    designed for image classification, we propose Pyramid Vision Transformer~(PVT), which overcomes the
    difficulties of porting Transformer to various dense prediction tasks. PVT has several merits compared
    to prior arts. (1) Different from ViT that typically has low-resolution outputs and high computational
    and memory cost, PVT can be not only trained on dense partitions of the image to achieve high output
    resolution, which is important for dense predictions but also using a progressive shrinking pyramid
    to reduce computations of large feature maps. (2) PVT inherits the advantages from both CNN and Transformer,
    making it a unified backbone in various vision tasks without convolutions by simply replacing CNN
    backbones. (3) We validate PVT by conducting extensive experiments, showing that it boosts the performance
    of many downstream tasks, e.g., object detection, semantic, and instance segmentation. For example,
    with a comparable number of parameters, RetinaNet+PVT achieves 40.4 AP on the COCO dataset, surpassing
    RetinNet+ResNet50 (36.3 AP) by 4.1 absolute AP. We hope PVT could serve as an alternative and useful
    backbone for pixel-level predictions and facilitate future researches. Code is available at https://github.com/whai362/PVT.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2102.12122
  abstract_summary: PVT builds a progressive shrinking pyramid that produces multi-scale, high-resolution
    features for object detection and segmentation without a convolutional backbone.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2102.12122
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: 8613f51e4a78907556243373be5dfe604a04e56366b092c84ef73b6d5d45272b
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2103.15808
  arxiv_id: '2103.15808'
  title: 'CvT: Introducing Convolutions to Vision Transformers'
  year: 2021
  abstract: 'We present in this paper a new architecture, named Convolutional vision Transformer (CvT),
    that improves Vision Transformer (ViT) in performance and efficiency by introducing convolutions into
    ViT to yield the best of both designs. This is accomplished through two primary modifications: a hierarchy
    of Transformers containing a new convolutional token embedding, and a convolutional Transformer block
    leveraging a convolutional projection. These changes introduce desirable properties of convolutional
    neural networks (CNNs) to the ViT architecture (\ie shift, scale, and distortion invariance) while
    maintaining the merits of Transformers (\ie dynamic attention, global context, and better generalization).
    We validate CvT by conducting extensive experiments, showing that this approach achieves state-of-the-art
    performance over other Vision Transformers and ResNets on ImageNet-1k, with fewer parameters and lower
    FLOPs. In addition, performance gains are maintained when pretrained on larger datasets (\eg ImageNet-22k)
    and fine-tuned to downstream tasks. Pre-trained on ImageNet-22k, our CvT-W24 obtains a top-1 accuracy
    of 87.7\% on the ImageNet-1k val set. Finally, our results show that the positional encoding, a crucial
    component in existing Vision Transformers, can be safely removed in our model, simplifying the design
    for higher resolution vision tasks. Code will be released at \url{https://github.com/leoxiaobin/CvT}.'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2103.15808
  abstract_summary: CvT introduces convolutional token embedding, hierarchy, and convolutional projections
    to combine CNN inductive biases with global transformer context.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2103.15808
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: 7af63a51a9beeb88f915766a9c8affff815d0dc8c86ab2ca89b4e85231360b9b
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2104.14294
  arxiv_id: '2104.14294'
  title: Emerging Properties in Self-Supervised Vision Transformers
  year: 2021
  abstract: 'In this paper, we question if self-supervised learning provides new properties to Vision
    Transformer (ViT) that stand out compared to convolutional networks (convnets). Beyond the fact that
    adapting self-supervised methods to this architecture works particularly well, we make the following
    observations: first, self-supervised ViT features contain explicit information about the semantic
    segmentation of an image, which does not emerge as clearly with supervised ViTs, nor with convnets.
    Second, these features are also excellent k-NN classifiers, reaching 78.3% top-1 on ImageNet with
    a small ViT. Our study also underlines the importance of momentum encoder, multi-crop training, and
    the use of small patches with ViTs. We implement our findings into a simple self-supervised method,
    called DINO, which we interpret as a form of self-distillation with no labels. We show the synergy
    between DINO and ViTs by achieving 80.1% top-1 on ImageNet in linear evaluation with ViT-Base.'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2104.14294
  abstract_summary: DINO studies self-supervised vision transformers and finds emergent semantic segmentation
    and strong nearest-neighbor features using momentum encoders, multi-crop training, and small patches.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2104.14294
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: 59338873cb647006eb740f58e07d1b3391819ffb9d58047d9d73613b638afbcb
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2111.06377
  arxiv_id: '2111.06377'
  title: Masked Autoencoders Are Scalable Vision Learners
  year: 2021
  abstract: 'This paper shows that masked autoencoders (MAE) are scalable self-supervised learners for
    computer vision. Our MAE approach is simple: we mask random patches of the input image and reconstruct
    the missing pixels. It is based on two core designs. First, we develop an asymmetric encoder-decoder
    architecture, with an encoder that operates only on the visible subset of patches (without mask tokens),
    along with a lightweight decoder that reconstructs the original image from the latent representation
    and mask tokens. Second, we find that masking a high proportion of the input image, e.g., 75%, yields
    a nontrivial and meaningful self-supervisory task. Coupling these two designs enables us to train
    large models efficiently and effectively: we accelerate training (by 3x or more) and improve accuracy.
    Our scalable approach allows for learning high-capacity models that generalize well: e.g., a vanilla
    ViT-Huge model achieves the best accuracy (87.8%) among methods that use only ImageNet-1K data. Transfer
    performance in downstream tasks outperforms supervised pre-training and shows promising scaling behavior.'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2111.06377
  abstract_summary: MAE masks most image patches and uses an asymmetric encoder-decoder to reconstruct
    pixels, enabling efficient scalable self-supervised pretraining of large vision transformers.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2111.06377
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: c465c9c043178422233b1d8aa70ccfe2d873fb271063b32ff71c0336e7826de5
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2104.01136
  arxiv_id: '2104.01136'
  title: 'LeViT: a Vision Transformer in ConvNet''s Clothing for Faster Inference'
  year: 2021
  abstract: 'We design a family of image classification architectures that optimize the trade-off between
    accuracy and efficiency in a high-speed regime. Our work exploits recent findings in attention-based
    architectures, which are competitive on highly parallel processing hardware. We revisit principles
    from the extensive literature on convolutional neural networks to apply them to transformers, in particular
    activation maps with decreasing resolutions. We also introduce the attention bias, a new way to integrate
    positional information in vision transformers. As a result, we propose LeVIT: a hybrid neural network
    for fast inference image classification. We consider different measures of efficiency on different
    hardware platforms, so as to best reflect a wide range of application scenarios. Our extensive experiments
    empirically validate our technical choices and show they are suitable to most architectures. Overall,
    LeViT significantly outperforms existing convnets and vision transformers with respect to the speed/accuracy
    tradeoff. For example, at 80% ImageNet top-1 accuracy, LeViT is 5 times faster than EfficientNet on
    CPU. We release the code at https://github.com/facebookresearch/LeViT'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2104.01136
  abstract_summary: LeViT combines attention architectures with decreasing-resolution convolutional design
    principles to optimize the high-speed inference accuracy trade-off.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2104.01136
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: e165065d9ac7d67b2e417b0ab1a255ab4cdaa1222b893e25e4e52875f87bf95e
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2110.02178
  arxiv_id: '2110.02178'
  title: 'MobileViT: Light-weight, General-purpose, and Mobile-friendly Vision Transformer'
  year: 2021
  abstract: 'Light-weight convolutional neural networks (CNNs) are the de-facto for mobile vision tasks.
    Their spatial inductive biases allow them to learn representations with fewer parameters across different
    vision tasks. However, these networks are spatially local. To learn global representations, self-attention-based
    vision trans-formers (ViTs) have been adopted. Unlike CNNs, ViTs are heavy-weight. In this paper,
    we ask the following question: is it possible to combine the strengths of CNNs and ViTs to build a
    light-weight and low latency network for mobile vision tasks? Towards this end, we introduce MobileViT,
    a light-weight and general-purpose vision transformer for mobile devices. MobileViT presents a different
    perspective for the global processing of information with transformers, i.e., transformers as convolutions.
    Our results show that MobileViT significantly outperforms CNN- and ViT-based networks across different
    tasks and datasets. On the ImageNet-1k dataset, MobileViT achieves top-1 accuracy of 78.4% with about
    6 million parameters, which is 3.2% and 6.2% more accurate than MobileNetv3 (CNN-based) and DeIT (ViT-based)
    for a similar number of parameters. On the MS-COCO object detection task, MobileViT is 5.7% more accurate
    than MobileNetv3 for a similar number of parameters. Our source code is open-source and available
    at: https://github.com/apple/ml-cvnets'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2110.02178
  abstract_summary: MobileViT combines local convolutional processing with global transformer representations
    to build lightweight models for classification, detection, and mobile deployment.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2110.02178
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: dc154d38ddbc7c9fd10dcc36187cda8075a9f370918066b9aa9c692435ce6792
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2206.01191
  arxiv_id: '2206.01191'
  title: 'EfficientFormer: Vision Transformers at MobileNet Speed'
  year: 2022
  abstract: 'Vision Transformers (ViT) have shown rapid progress in computer vision tasks, achieving promising
    results on various benchmarks. However, due to the massive number of parameters and model design,
    \textit{e.g.}, attention mechanism, ViT-based models are generally times slower than lightweight convolutional
    networks. Therefore, the deployment of ViT for real-time applications is particularly challenging,
    especially on resource-constrained hardware such as mobile devices. Recent efforts try to reduce the
    computation complexity of ViT through network architecture search or hybrid design with MobileNet
    block, yet the inference speed is still unsatisfactory. This leads to an important question: can transformers
    run as fast as MobileNet while obtaining high performance? To answer this, we first revisit the network
    architecture and operators used in ViT-based models and identify inefficient designs. Then we introduce
    a dimension-consistent pure transformer (without MobileNet blocks) as a design paradigm. Finally,
    we perform latency-driven slimming to get a series of final models dubbed EfficientFormer. Extensive
    experiments show the superiority of EfficientFormer in performance and speed on mobile devices. Our
    fastest model, EfficientFormer-L1, achieves $79.2\%$ top-1 accuracy on ImageNet-1K with only $1.6$
    ms inference latency on iPhone 12 (compiled with CoreML), which runs as fast as MobileNetV2$\times
    1.4$ ($1.6$ ms, $74.7\%$ top-1), and our largest model, EfficientFormer-L7, obtains $83.3\%$ accuracy
    with only $7.0$ ms latency. Our work proves that properly designed transformers can reach extremely
    low latency on mobile devices while maintaining high performance.'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2206.01191
  abstract_summary: EfficientFormer removes latency-heavy operators and applies latency-driven slimming
    to produce pure transformers with mobile-device inference speed and competitive ImageNet accuracy.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2206.01191
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: dd02c43a7b996276c44eccf384a7aadbcd455aee17e21013fb76ac463a78beda
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2105.01601
  arxiv_id: '2105.01601'
  title: 'MLP-Mixer: An all-MLP Architecture for Vision'
  year: 2021
  abstract: 'Convolutional Neural Networks (CNNs) are the go-to model for computer vision. Recently, attention-based
    networks, such as the Vision Transformer, have also become popular. In this paper we show that while
    convolutions and attention are both sufficient for good performance, neither of them are necessary.
    We present MLP-Mixer, an architecture based exclusively on multi-layer perceptrons (MLPs). MLP-Mixer
    contains two types of layers: one with MLPs applied independently to image patches (i.e. "mixing"
    the per-location features), and one with MLPs applied across patches (i.e. "mixing" spatial information).
    When trained on large datasets, or with modern regularization schemes, MLP-Mixer attains competitive
    scores on image classification benchmarks, with pre-training and inference cost comparable to state-of-the-art
    models. We hope that these results spark further research beyond the realms of well established CNNs
    and Transformers.'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2105.01601
  abstract_summary: MLP-Mixer performs channel and spatial token mixing using only multilayer perceptrons,
    providing a neighboring non-attention architecture for the vision-transformer corpus.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2105.01601
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: 28f9d0058cca0f016925b2ae893be69bbefa5ad826f5b713cb72d106dfb1178a
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2105.03404
  arxiv_id: '2105.03404'
  title: 'ResMLP: Feedforward networks for image classification with data-efficient training'
  year: 2021
  abstract: We present ResMLP, an architecture built entirely upon multi-layer perceptrons for image classification.
    It is a simple residual network that alternates (i) a linear layer in which image patches interact,
    independently and identically across channels, and (ii) a two-layer feed-forward network in which
    channels interact independently per patch. When trained with a modern training strategy using heavy
    data-augmentation and optionally distillation, it attains surprisingly good accuracy/complexity trade-offs
    on ImageNet. We also train ResMLP models in a self-supervised setup, to further remove priors from
    employing a labelled dataset. Finally, by adapting our model to machine translation we achieve surprisingly
    good results. We share pre-trained models and our code based on the Timm library.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2105.03404
  abstract_summary: ResMLP alternates cross-patch linear layers and per-patch feed-forward networks without
    convolution or attention, providing a neighboring non-transformer visual architecture.
  abstract_source: arxiv_api
