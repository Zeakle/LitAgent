    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2112.05131
  abstract_summary: Plenoxels uses a sparse voxel grid with spherical harmonics and direct optimization
    to train radiance fields much faster without neural network components.
  abstract_source: arxiv_api
