- paper_id: arxiv:2011.13961
  arxiv_id: '2011.13961'
  title: 'D-NeRF: Neural Radiance Fields for Dynamic Scenes'
  year: 2020
  abstract: 'Neural rendering techniques combining machine learning with geometric reasoning have arisen
    as one of the most promising approaches for synthesizing novel views of a scene from a sparse set
    of images. Among these, stands out the Neural radiance fields (NeRF), which trains a deep network
    to map 5D input coordinates (representing spatial location and viewing direction) into a volume density
    and view-dependent emitted radiance. However, despite achieving an unprecedented level of photorealism
    on the generated images, NeRF is only applicable to static scenes, where the same spatial location
    can be queried from different images. In this paper we introduce D-NeRF, a method that extends neural
    radiance fields to a dynamic domain, allowing to reconstruct and render novel images of objects under
    rigid and non-rigid motions from a \emph{single} camera moving around the scene. For this purpose
    we consider time as an additional input to the system, and split the learning process in two main
    stages: one that encodes the scene into a canonical space and another that maps this canonical representation
    into the deformed scene at a particular time. Both mappings are simultaneously learned using fully-connected
    networks. Once the networks are trained, D-NeRF can render novel images, controlling both the camera
    view and the time variable, and thus, the object movement. We demonstrate the effectiveness of our
    approach on scenes with objects under rigid, articulated and non-rigid motions. Code, model weights
    and the dynamic scenes dataset will be released.'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2011.13961
  abstract_summary: D-NeRF adds time and a learned deformation into canonical space to reconstruct and
    render rigid and non-rigid dynamic scenes from a moving monocular camera.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2011.13961
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: 7174015741e67e2d2d8f658d40d52172f5b79f9e714aca84335767d4daad92bc
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2011.12948
  arxiv_id: '2011.12948'
  title: 'Nerfies: Deformable Neural Radiance Fields'
  year: 2020
  abstract: We present the first method capable of photorealistically reconstructing deformable scenes
    using photos/videos captured casually from mobile phones. Our approach augments neural radiance fields
    (NeRF) by optimizing an additional continuous volumetric deformation field that warps each observed
    point into a canonical 5D NeRF. We observe that these NeRF-like deformation fields are prone to local
    minima, and propose a coarse-to-fine optimization method for coordinate-based models that allows for
    more robust optimization. By adapting principles from geometry processing and physical simulation
    to NeRF-like models, we propose an elastic regularization of the deformation field that further improves
    robustness. We show that our method can turn casually captured selfie photos/videos into deformable
    NeRF models that allow for photorealistic renderings of the subject from arbitrary viewpoints, which
    we dub "nerfies." We evaluate our method by collecting time-synchronized data using a rig with two
    mobile phones, yielding train/validation images of the same pose at different viewpoints. We show
    that our method faithfully reconstructs non-rigidly deforming scenes and reproduces unseen views with
    high fidelity.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2011.12948
  abstract_summary: Nerfies augments NeRF with a continuous deformation field, coarse-to-fine optimization,
    and elastic regularization for casually captured deformable scenes.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2011.12948
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: 68219bc19c2914193da71f026ff7f10827192efbdffebc39a7f1595e180e99db
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2106.13228
  arxiv_id: '2106.13228'
  title: 'HyperNeRF: A Higher-Dimensional Representation for Topologically Varying Neural Radiance Fields'
  year: 2021
  abstract: 'Neural Radiance Fields (NeRF) are able to reconstruct scenes with unprecedented fidelity,
    and various recent works have extended NeRF to handle dynamic scenes. A common approach to reconstruct
    such non-rigid scenes is through the use of a learned deformation field mapping from coordinates in
    each input image into a canonical template coordinate space. However, these deformation-based approaches
    struggle to model changes in topology, as topological changes require a discontinuity in the deformation
    field, but these deformation fields are necessarily continuous. We address this limitation by lifting
    NeRFs into a higher dimensional space, and by representing the 5D radiance field corresponding to
    each individual input image as a slice through this "hyper-space". Our method is inspired by level
    set methods, which model the evolution of surfaces as slices through a higher dimensional surface.
    We evaluate our method on two tasks: (i) interpolating smoothly between "moments", i.e., configurations
    of the scene, seen in the input images while maintaining visual plausibility, and (ii) novel-view
    synthesis at fixed moments. We show that our method, which we dub HyperNeRF, outperforms existing
    methods on both tasks. Compared to Nerfies, HyperNeRF reduces average error rates by 4.1% for interpolation
    and 8.6% for novel-view synthesis, as measured by LPIPS. Additional videos, results, and visualizations
    are available at https://hypernerf.github.io.'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2106.13228
  abstract_summary: HyperNeRF lifts dynamic radiance fields into a higher-dimensional space so slices
    can represent topological changes that continuous canonical deformation fields cannot.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2106.13228
  abstract_accessed_at: '2026-09-19'
