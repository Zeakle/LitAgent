  abstract_accessed_at: '2026-09-19'
  abstract_sha256: c0c70de44ef95a39d7c05e62698dbb4323ea602e9ed797311f32a8d6895fdcb4
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2010.07492
  arxiv_id: '2010.07492'
  title: 'NeRF++: Analyzing and Improving Neural Radiance Fields'
  year: 2020
  abstract: Neural Radiance Fields (NeRF) achieve impressive view synthesis results for a variety of capture
    settings, including 360 capture of bounded scenes and forward-facing capture of bounded and unbounded
    scenes. NeRF fits multi-layer perceptrons (MLPs) representing view-invariant opacity and view-dependent
    color volumes to a set of training images, and samples novel views based on volume rendering techniques.
    In this technical report, we first remark on radiance fields and their potential ambiguities, namely
    the shape-radiance ambiguity, and analyze NeRF's success in avoiding such ambiguities. Second, we
    address a parametrization issue involved in applying NeRF to 360 captures of objects within large-scale,
    unbounded 3D scenes. Our method improves view synthesis fidelity in this challenging scenario. Code
    is available at https://github.com/Kai-46/nerfplusplus.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2010.07492
  abstract_summary: NeRF++ analyzes shape-radiance ambiguity and introduces a parameterization for 360-degree
    captures of objects embedded in large unbounded scenes.
