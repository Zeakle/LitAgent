  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2308.04079
  arxiv_id: '2308.04079'
  title: 3D Gaussian Splatting for Real-Time Radiance Field Rendering
  year: 2023
  abstract: Radiance Field methods have recently revolutionized novel-view synthesis of scenes captured
    with multiple photos or videos. However, achieving high visual quality still requires neural networks
    that are costly to train and render, while recent faster methods inevitably trade off speed for quality.
    For unbounded and complete scenes (rather than isolated objects) and 1080p resolution rendering, no
    current method can achieve real-time display rates. We introduce three key elements that allow us
    to achieve state-of-the-art visual quality while maintaining competitive training times and importantly
    allow high-quality real-time (>= 30 fps) novel-view synthesis at 1080p resolution. First, starting
    from sparse points produced during camera calibration, we represent the scene with 3D Gaussians that
    preserve desirable properties of continuous volumetric radiance fields for scene optimization while
    avoiding unnecessary computation in empty space; Second, we perform interleaved optimization/density
    control of the 3D Gaussians, notably optimizing anisotropic covariance to achieve an accurate representation
    of the scene; Third, we develop a fast visibility-aware rendering algorithm that supports anisotropic
    splatting and both accelerates training and allows realtime rendering. We demonstrate state-of-the-art
    visual quality and real-time rendering on several established datasets.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2308.04079
  abstract_summary: 3D Gaussian Splatting uses optimized anisotropic Gaussian primitives and a visibility-aware
    rasterizer for real-time novel-view synthesis, serving as a close non-NeRF distractor.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2308.04079
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: 5f0257f9c75e41e06ddc6539e97df2f117295fa87534ebd5ff390135c3f79d7f
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:1906.07751
  arxiv_id: '1906.07751'
  title: 'Neural Volumes: Learning Dynamic Renderable Volumes from Images'
  year: 2019
  abstract: 'Modeling and rendering of dynamic scenes is challenging, as natural scenes often contain
    complex phenomena such as thin structures, evolving topology, translucency, scattering, occlusion,
    and biological motion. Mesh-based reconstruction and tracking often fail in these cases, and other
    approaches (e.g., light field video) typically rely on constrained viewing conditions, which limit
    interactivity. We circumvent these difficulties by presenting a learning-based approach to representing
    dynamic objects inspired by the integral projection model used in tomographic imaging. The approach
    is supervised directly from 2D images in a multi-view capture setting and does not require explicit
    reconstruction or tracking of the object. Our method has two primary components: an encoder-decoder
    network that transforms input images into a 3D volume representation, and a differentiable ray-marching
    operation that enables end-to-end training. By virtue of its 3D representation, our construction extrapolates
    better to novel viewpoints compared to screen-space rendering techniques. The encoder-decoder architecture
    learns a latent representation of a dynamic scene that enables us to produce novel content sequences
    not seen during training. To overcome memory limitations of voxel-based representations, we learn
    a dynamic irregular grid structure implemented with a warp field during ray-marching. This structure
    greatly improves the apparent resolution and reduces grid-like artifacts and jagged motion. Finally,
    we demonstrate how to incorporate surface-based representations into our volumetric-learning framework
    for applications where the highest resolution is required, using facial performance capture as a case
    in point.'
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/1906.07751
  abstract_summary: Neural Volumes learns dynamic 3D volume representations and differentiable ray marching
    from multi-view images, serving as a neighboring pre-NeRF volumetric rendering paper.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/1906.07751
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: e440d9c954b1669f668520304d2a5e9a64a19a5e12698c3b79ab9bc8c6ee3071
  abstract_source_version: arxiv_atom_v1
