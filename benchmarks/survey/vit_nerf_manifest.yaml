- paper_id: arxiv:2112.05131
  arxiv_id: '2112.05131'
  title: 'Plenoxels: Radiance Fields without Neural Networks'
  year: 2021
  abstract: We introduce Plenoxels (plenoptic voxels), a system for photorealistic view synthesis. Plenoxels
    represent a scene as a sparse 3D grid with spherical harmonics. This representation can be optimized
    from calibrated images via gradient methods and regularization without any neural components. On standard,
    benchmark tasks, Plenoxels are optimized two orders of magnitude faster than Neural Radiance Fields
    with no loss in visual quality.
