- paper_id: arxiv:2103.13415
  arxiv_id: '2103.13415'
  title: 'Mip-NeRF: A Multiscale Representation for Anti-Aliasing Neural Radiance Fields'
  year: 2021
  abstract: The rendering procedure used by neural radiance fields (NeRF) samples a scene with a single
    ray per pixel and may therefore produce renderings that are excessively blurred or aliased when training
    or testing images observe scene content at different resolutions. The straightforward solution of
    supersampling by rendering with multiple rays per pixel is impractical for NeRF, because rendering
    each ray requires querying a multilayer perceptron hundreds of times. Our solution, which we call
    "mip-NeRF" (a la "mipmap"), extends NeRF to represent the scene at a continuously-valued scale. By
    efficiently rendering anti-aliased conical frustums instead of rays, mip-NeRF reduces objectionable
    aliasing artifacts and significantly improves NeRF's ability to represent fine details, while also
    being 7% faster than NeRF and half the size. Compared to NeRF, mip-NeRF reduces average error rates
    by 17% on the dataset presented with NeRF and by 60% on a challenging multiscale variant of that dataset
    that we present. Mip-NeRF is also able to match the accuracy of a brute-force supersampled NeRF on
    our multiscale dataset while being 22x faster.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2103.13415
  abstract_summary: Mip-NeRF renders conical frustums rather than individual rays so a radiance field
    can represent continuously varying scale and reduce blur and aliasing.
  abstract_source: arxiv_api
  abstract_url: https://arxiv.org/abs/2103.13415
  abstract_accessed_at: '2026-09-19'
  abstract_sha256: c37932d077266ca97fb7040d3041e6f9c9f7a4fb7ed25a50bb50cf8948636f49
  abstract_source_version: arxiv_atom_v1
- paper_id: arxiv:2111.12077
  arxiv_id: '2111.12077'
  title: 'Mip-NeRF 360: Unbounded Anti-Aliased Neural Radiance Fields'
  year: 2021
  abstract: Though neural radiance fields (NeRF) have demonstrated impressive view synthesis results on
    objects and small bounded regions of space, they struggle on "unbounded" scenes, where the camera
    may point in any direction and content may exist at any distance. In this setting, existing NeRF-like
    models often produce blurry or low-resolution renderings (due to the unbalanced detail and scale of
    nearby and distant objects), are slow to train, and may exhibit artifacts due to the inherent ambiguity
    of the task of reconstructing a large scene from a small set of images. We present an extension of
    mip-NeRF (a NeRF variant that addresses sampling and aliasing) that uses a non-linear scene parameterization,
    online distillation, and a novel distortion-based regularizer to overcome the challenges presented
    by unbounded scenes. Our model, which we dub "mip-NeRF 360" as we target scenes in which the camera
    rotates 360 degrees around a point, reduces mean-squared error by 57% compared to mip-NeRF, and is
    able to produce realistic synthesized views and detailed depth maps for highly intricate, unbounded
    real-world scenes.
  pdf:
    kind: arxiv_pdf
    url: https://arxiv.org/pdf/2111.12077
  abstract_summary: Mip-NeRF 360 adds a nonlinear unbounded-scene parameterization, online distillation,
    and distortion regularization for detailed 360-degree captures.
  abstract_source: arxiv_api
