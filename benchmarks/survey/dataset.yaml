    expected_topics:
      - {topic_id: episodic-matching, description: Matching Networks and episodic support-set prediction, source_paper_ids: [arxiv:1606.04080], required: true}
      - {topic_id: prototypes, description: Prototype-based metric spaces and class representatives, source_paper_ids: [arxiv:1703.05175], required: true}
      - {topic_id: relation-metrics, description: Learned or task-adaptive relation metrics, source_paper_ids: [arxiv:1711.06025, arxiv:1805.10123], required: false}
      - {topic_id: set-distance, description: Set-level Earth Mover distance for local descriptors, source_paper_ids: [arxiv:2003.06777], required: false}
