    title: "MaPLe: Multi-modal Prompt Learning"
    authors:
      - Muhammad Uzair Khattak
      - Hanoona Rasheed
      - Muhammad Maaz
      - Salman Khan
      - Fahad Shahbaz Khan
    year: 2022
    abstract: >-
      MaPLe adapts CLIP by learning coupled prompts in both the vision and language branches. It evaluates
      generalization to novel classes, new target datasets, and unseen domain shifts, making it a direct
      source for the benchmark's vision-language adaptation and generalization topic.
