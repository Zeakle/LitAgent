agent:
  max_loops: 15

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

memory:
  redis_url: "redis://localhost:6380"   # host 6380 → 避开 LangFuse redis(6379)，与 docker-compose.yml 对齐
  qdrant_url: "http://localhost:6333"
  working_ttl_seconds: 1800  # Working Memory TTL
  pg_url: "postgresql://litagent:litagent@localhost:5433/litagent"   # host 5433 → 避开 LangFuse postgres(5432)

context:
  # Input assembly budget; generated output is controlled separately below.
  max_tokens: 32768
  compact_threshold: 0.85
  # ── Phase 13.8 evidence-grounded synthesis ──
  synthesis_evidence_max_tokens: 16000   # evidence plan + selected ledger
  synthesis_papers_max_tokens: 8000      # structural paper catalog
  evidence_top_k_per_section: 12        # per-section rerank top-k
  evidence_max_items: 60                # global selected items cap
  evidence_per_paper_cap: 4             # max evidence items per paper
  review_evidence_max_tokens: 10000      # reviewer evidence layer
  review_draft_max_tokens: 14000         # reviewer draft layer
  review_feedback_max_tokens: 2000      # bounded previous-review feedback

extractor:
  max_concurrent: 5
  enable_llm: true
  max_papers: 50
  per_paper_timeout_ms: 20000

orchestrator:
  timeout_ms: 600000       # 整体编排超时 10 分钟
  max_concurrent: 5        # 最大并行 Worker 数

llm:
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  max_tokens: 20000
  temperature: 0.1

relevance:
  max_papers: 50
  min_papers: 10
  cross_encoder_min_score: null
  lexical_min_score: 0.0

rag:
  enabled: true
  paper_collection: "papers"
  benchmark_collection: "papers_benchmark"
  claims_collection: "claims"
  corpus_version: "v1"
  schema_version: "paper-v1"
  parser_version: "pymupdf-v1"
  chunking_version: "page-block-v1"
  embedding_model: "all-MiniLM-L6-v2"
  content_mode: "abstract"
  candidate_k: 40
  top_k: 20
  reranker_enabled: true
  writeback_enabled: false
  manifest_path: "corpus/manifest.yaml"
  raw_root: "artifacts/corpus/raw"
  quarantine_root: "artifacts/corpus/quarantine"
  max_pdf_bytes: 52428800
  parsed_root: "artifacts/corpus/parsed"
  max_representative_chunks: 4
  trusted_claim_recall_top_k: 5
  trusted_claim_context_max_chars: 4000
  quality:
    max_gibberish_ratio: 0.15
    min_text_page_ratio: 0.20
    repeated_margin_min_pages: 2
    margin_ratio: 0.10

adversarial:
  max_rounds: 3
  pass_threshold: 0.8  # Reviewer评分 >= 0.8是未通过
  review_max_tokens: 12288  # output cap; includes reasoning tokens in thinking mode

mcp_servers: {} 

safety:
  max_cost_tokens: 500000
  cost_warn_ratio: 0.8

resilience:
  cb_fail_threshold: 5       # 连续失败 5 次熔断
  cb_cooldown_seconds: 60    # 熔断后冷却 60 秒

observability:
  enabled: true           # LangFuse unavailable or missing keys degrades to a no-op tracer
  langfuse_host: "http://localhost:3000"
  payload_mode: "full_redacted"  # 上传完整非密钥 I/O；密钥和认证值递归剔除

eval:
  max_tokens: 16384       # output cap; citation/faithfulness reasoning needs more than 8K
  faithfulness_max_evidence_items: 40
  faithfulness_max_context_chars: 24000
  rewrite:
    max_items: 30
    max_chars: 15000
    min_body_length_ratio: 0.5
    min_paragraph_ratio: 0.5

planner:
  decompose_enabled: true   # LLM 把 query 扩展成 2-3 子 query（多路召回）；false 退回单 query
  max_sub_queries: 3        # 子 query 上限（含原始），防 N×源 组合爆炸
  max_tokens: 8192          # structured output is short, but thinking mode also consumes this cap
  temperature: 0.3          # 略高促子 query 多样化
  use_procedural_profiles: false      # 13.7.1：开关开启后 planner 用画像重排 source
  procedural_min_samples: 3           # 样本数不足不排
