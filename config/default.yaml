agent:
  max_loops: 15
  per_tool_timeout_ms: 30000
  per_loop_timeout_ms: 600000

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

memory:
  redis_url: "redis://localhost:6380"   # host 6380 → 避开 LangFuse redis(6379)，与 docker-compose.yml 对齐
  qdrant_url: "http://localhost:6333"
  working_ttl_seconds: 1800  # Working Memory TTL
  pg_url: "postgresql://litagent:litagent@localhost:5433/litagent"   # host 5433 → 避开 LangFuse postgres(5432)

context:
  max_tokens: 16000
  compact_threshold: 0.7

orchestrator:
  timeout_ms: 600000       # 整体编排超时 10 分钟
  max_concurrent: 5        # 最大并行 Worker 数

llm:
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  max_tokens: 4096
  temperature: 0.1

adversarial:
  max_rounds: 3
  pass_threshold: 0.8  # Reviewer评分 >= 0.8是未通过

mcp_servers: {} 

safety:
  max_cost_tokens: 500000
  cost_warn_ratio: 0.8

resilience:
  cb_fail_threshold: 5       # 连续失败 5 次熔断
  cb_cooldown_seconds: 60    # 熔断后冷却 60 秒

observability:
  enabled: false          # 改 true 启用 LangFuse tracing（需先起 LangFuse 服务）
  langfuse_host: "http://localhost:3000"