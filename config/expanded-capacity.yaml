# Explicit capacity profile for NEW planned-budget-v7 tasks only.
# Keep historical default.yaml unchanged; 4.5M tokens / 64 requests remain hard caps.
agent:
  max_loops: 15
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
memory:
  redis_url: redis://localhost:6380
  qdrant_url: http://localhost:6333
  working_ttl_seconds: 1800
  pg_url: postgresql://litagent:litagent@localhost:5433/litagent
context:
  evidence_reranker_enabled: true
  evidence_reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  max_tokens: 32768
  compact_threshold: 0.85
  synthesis_evidence_max_tokens: 16000
  synthesis_papers_max_tokens: 8000
  evidence_top_k_per_section: 12
  evidence_max_items: 60
  evidence_per_paper_cap: 4
  review_evidence_max_tokens: 16000
  review_draft_max_tokens: 14000
  review_feedback_max_tokens: 2000
extractor:
  record_identity: source_fields_v1
  max_concurrent: 5
  enable_llm: true
  max_papers: 50
  max_tokens: 8192
  thinking_mode: disabled
  per_paper_timeout_ms: 120000
  task_timeout_ms: 1200000
  automatic_timeout_seconds: 210
orchestrator:
  timeout_ms: 7200000
  max_concurrent: 5
  task_timeouts_ms:
    search: 120000
    recall: 120000
    dedup: 120000
    relevance_gate: 180000
    graph_analysis: 120000
llm:
  base_url: https://ark.cn-beijing.volces.com/api/v3
  model: doubao-seed-2-1-lite-260915
  extraction_model: doubao-seed-2-1-lite-260915
  generation_model: doubao-seed-2-1-pro-260915
  evaluation_model: doubao-seed-2-1-lite-260915
  max_tokens: 24576
  temperature: 0.1
  request_deadline_margin_seconds: 5.0
  request_timeouts_seconds:
    default: 180.0
    planning: 120.0
    extraction: 180.0
    synthesis: 600.0
    summary: 300.0
    reviewer: 300.0
    revision: 600.0
    repair: 600.0
    evaluation: 300.0
relevance:
  reranker_enabled: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  max_papers: 50
  min_papers: 10
  cross_encoder_min_score: null
  lexical_min_score: 0.0
rag:
  enabled: true
  paper_collection: papers
  benchmark_collection: papers_benchmark
  claims_collection: claims
  corpus_version: v1
  schema_version: paper-v1
  parser_version: pymupdf-v1
  chunking_version: page-block-v1
  chunk_strategy: page_block
  chunk_size: 1200
  chunk_overlap: 150
  embedding_backend: sentence_transformer
  embedding_model: all-MiniLM-L6-v2
  embedding_document_adapter: null
  embedding_query_adapter: null
  content_mode: abstract
  retrieval_mode: rrf
  candidate_k: 40
  top_k: 20
  reranker_enabled: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  writeback_enabled: false
  manifest_path: corpus/manifest.yaml
  raw_root: artifacts/corpus/raw
  quarantine_root: artifacts/corpus/quarantine
  max_pdf_bytes: 52428800
  download_timeout_seconds: 60.0
  parser_timeout_seconds: 30.0
  max_concurrent_parsers: 2
  allowed_pdf_content_types:
  - application/pdf
  - application/octet-stream
  parsed_root: artifacts/corpus/parsed
  max_representative_chunks: 4
  trusted_claim_recall_top_k: 5
  trusted_claim_context_max_chars: 4000
  quality:
    max_gibberish_ratio: 0.15
    min_text_page_ratio: 0.2
    repeated_margin_min_pages: 2
    margin_ratio: 0.1
adversarial:
  max_rounds: 3
  pass_threshold: 0.8
  review_max_tokens: 16384
  thinking_mode: disabled
  task_timeout_ms: 3600000
mcp_servers: {}
safety:
  max_cost_tokens: 500000
  cost_warn_ratio: 0.8
  tool_policy:
    allowed_names:
    - search_arxiv
    - search_semantic_scholar
    - search_huggingface
    - extract_claims
    - extract_metrics
    - extract_methods
    - extract_datasets
    allowed_categories:
    - read
api:
  max_concurrent_surveys: 2
  cancellation_grace_seconds: 5.0
resilience:
  cb_fail_threshold: 5
  cb_cooldown_seconds: 60
observability:
  enabled: true
  langfuse_host: http://localhost:3000
  payload_mode: full_redacted
eval:
  context_tokens: 196608
  max_tokens: 32768
  thinking_mode: disabled
  timeout_seconds: 300.0
  total_timeout_seconds: 7200.0
  faithfulness_max_evidence_items: 120
  faithfulness_max_context_chars: 80000
  strict_batch_size: 16
  strict_max_batches: 8
  strict_max_claims: 128
  strict_context_margin: 0.1
  rewrite:
    max_items: 30
    max_chars: 15000
    min_body_length_ratio: 0.5
    min_paragraph_ratio: 0.5
planner:
  decompose_enabled: true
  max_sub_queries: 3
  max_tokens: 16384
  thinking_mode: disabled
  temperature: 0.3
  use_procedural_profiles: false
  procedural_min_samples: 3
report_audit:
  enabled: true
  judge_base_url: null
  judge_model: null
  judge_api_key_env: null
  judge_response_format: json_object
  judge_thinking_mode: disabled
  judge_context_tokens: 131072
  judge_input_tokens: 200000
  jev_enabled: true
