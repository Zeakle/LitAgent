version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: litagent
      POSTGRES_PASSWORD: litagent
      POSTGRES_DB: litagent
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/litagent/memory/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  pgdata: