version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports: ['6380:6379']   # host 6380 → 避开 LangFuse redis(6379)
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5433:5432"]   # host 5433 → 避开 LangFuse postgres(5432)
    environment:
      POSTGRES_USER: litagent
      POSTGRES_PASSWORD: litagent
      POSTGRES_DB: litagent
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/litagent/memory/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  pgdata: