services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Qdrant indexes and episodic memory survive container recreation.
      - qdrant_data:/qdrant/storage

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: litagent
      POSTGRES_PASSWORD: litagent
      POSTGRES_DB: litagent
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/litagent/memory/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  pgdata:
  qdrant_data:
